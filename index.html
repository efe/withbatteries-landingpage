<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <title>with batteries</title>
    <style type="text/css">
        body {
              font-family: "IBM Plex Mono", monospace;
          }
    </style>
    <script>
        const themes = [
          "light","dark","bumblebee","emerald","corporate","synthwave","cyberpunk","valentine","halloween","garden",
          "forest","aqua","lofi","pastel","fantasy","dracula","cmyk","autumn","black","business","acid",
          "lemonade","night","winter"
        ];
    
        let intervalId = null;
        let isRunning = false;
    
        function randomTheme() {
          const theme = themes[Math.floor(Math.random() * themes.length)];
          document.body.setAttribute("data-theme", theme);
        }
    
        function startThemes() {
          if (!isRunning) {
            randomTheme(); // instantly switch on resume
            intervalId = setInterval(randomTheme, 1000);
            isRunning = true;
          }
        }
    
        function stopThemes() {
          if (isRunning) {
            clearInterval(intervalId);
            isRunning = false;
          }
        }
    
        function toggleThemes() {
          if (isRunning) {
            stopThemes();
          } else {
            startThemes();
          }
        }
    
        window.addEventListener("load", () => {
          setTimeout(startThemes, 1500);
        });
    
        // Listen for space bar
        window.addEventListener("keydown", (e) => {
          if (e.code === "Space") {
            e.preventDefault(); // prevent page scrolling
            toggleThemes();
          }
        });
    </script>
</head>

<body data-theme="dracula" class="min-h-screen bg-base-200 p-6">
<div class="container mx-auto">
    <div class="card w-full md:w-full lg:w-1/2">
        <div class="card-body animate__animated animate__fadeIn animate__slow">
            <h1 class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl xl:text-8xl font-bold">with batteries</h1>
            <p class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl xl:text-6xl leading-relaxed text-secondary">
                is a digital product house that currently builds <a class="underline"
                                                                    href="https://yesglot.com">yesglot</a>.
            </p>
        </div>
    </div>
    <footer class="hidden md:block fixed bottom-4 right-4 text-sm bg-base-300 text-base-content px-3 py-2 rounded-lg shadow-lg opacity-70 hover:opacity-100 transition">
        ␣
    </footer>
</div>
</body>
</html>
